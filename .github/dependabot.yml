version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Supply-chain cooldown, matches exclude-newer in pyproject.toml
    cooldown:
      default-days: 14
      # Mirrors exclude-newer-package in pyproject.toml; without it Dependabot
      # can't see the required versions and backtracks to ancient sdists
      exclude:
        - "setuptools"
        - "certifi"
    groups:
      uv:
        patterns:
          - "*"
