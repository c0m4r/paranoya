name: lint_python
permissions:
  contents: read
on:
  push:
    paths:
      - '*.py'
      - 'lib/**.py'
      - '.github/workflows/lint_python.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
    - '*.py'
    - 'lib/**.py'
    - '.github/workflows/lint_python.yml'
    - 'pyproject.toml'
    - 'uv.lock'
jobs:
  lint_python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12.3'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: false
      - run: ./deploy.sh
      - run: |
          wget https://raw.githubusercontent.com/c0m4r/okrutnik/main/okrutnik.sh
          chmod +x okrutnik.sh
          uv export --locked --no-dev --format requirements-txt -o requirements.txt
          ./okrutnik.sh --install -r requirements.txt
      - run: ./okrutnik.sh lib/*.py || true
      - run: ./okrutnik.sh --stop lib/paranoya_constants.py || true
      - run: ./okrutnik.sh --stop lib/paranoya_args.py || true
      - run: ./okrutnik.sh --stop lib/paranoya_venv.py || true
      - run: ./okrutnik.sh --stop upgrader.py || true
      - run: ./okrutnik.sh --stop client.py || true
      - run: ./okrutnik.sh paranoya.py || true
      - run: uv sync --locked --group lint
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check .
      - run: black --diff .
      - run: codespell -L paranoya --skip="./.git/*" --skip="./signature-base" --skip="./lib/python3*" --skip="./.venv" --skip="./uv.lock" --skip="./requirements.txt"
      - run: mypy --strict --exclude 'lib64' --exclude '.venv' . || true
      - run: pylama *.py lib/*.py || true
      - run: pylint *.py lib/*.py || true
      - run: pyright . || true
      - run: ./paranoya.py -d &
      - run: sleep 6
      - run: ./client.py -p LICENSE
      - run: ./client.py -p ./test
      - run: kill -TERM $(cat paranoya.pid)
      - run: ./paranoya.py --noprocs --noindicator --dontwait --debug -p ./test
      - run: ./paranoya.py --noprocs --noindicator --dontwait --debug --intense -p ./test
      - run: ./paranoya.py --noprocs --noindicator --dontwait --debug --csv -p ./test
